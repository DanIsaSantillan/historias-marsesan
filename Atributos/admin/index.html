<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - MarseSan</title>

  <!-- Foto de Perfil como Icono -->
  <link rel="icon" href="../FondoPerfil/Perfil.png" type="image/png">
  <link rel="apple-touch-icon" href="../FondoPerfil/Perfil.png">

  <!-- Bootstrap 5 CSS e Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Google Fonts: Caveat para UI + Lora para lectura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <!-- Quill.js Editor CSS -->
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

  <!-- Ruta CSS -->
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="dark-galaxy">

  <!-- Navegación Superior con fondo de Galaxia -->
  <nav class="navbar navbar-expand-lg border-bottom galaxy">
    <div class="container-fluid px-4">
      <a class="btn btn-sm btn-outline-light font-artistic me-3" href="../../index.html">
        <i class="bi bi-arrow-left me-1"></i> Volver al Blog Público
      </a>
      
      <span class="navbar-brand text-white font-artistic fs-3 mb-0">
        <i class="bi bi-gear-wide-connected me-2"></i>Panel Privado de Gestión de Historias
      </span>

      <button class="btn btn-sm btn-outline-light text-light font-artistic ms-auto fw-bold" id="btnOpenCreateModal">
        <i class="bi bi-plus-circle me-1"></i> Nueva Historia / Capítulo
      </button>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-2">
      <h4 class="font-artistic text-white fs-2 mb-0">Tus Historias Registradas</h4>
      <span class="text-white-50 small font-artistic fs-5">Haz clic en una obra para editar sus capítulos o eliminarla</span>
    </div>

    <!-- Grid de Gestión de Obras -->
    <div class="row g-4" id="adminStoriesGrid">
      <!-- Se llena dinámicamente vía admin.js -->
    </div>
  </main>

  <!-- MODAL DE CREACIÓN / EDICIÓN -->
  <div class="modal fade" id="storyAdminModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content bg-dark border-secondary text-white">
        <div class="modal-header border-secondary">
          <h5 class="modal-title font-artistic fs-3 text-white" id="modalAdminTitle">✨ Redactar Nueva Historia</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        
        <div class="modal-body p-4">
          <input type="hidden" id="editingStoryId" value="">

          <div class="row g-3 mb-3">
            <!-- Título -->
            <div class="col-12 col-md-6">
              <label class="form-label font-artistic fs-5 text-white mb-1">Título de la Obra</label>
              <input type="text" id="adminStoryTitle" class="form-control bg-black text-white border-secondary font-artistic fs-5" placeholder="Ej. El Despertar del Dragón">
            </div>

            <!-- Selección / Creación de Universo -->
            <div class="col-12 col-md-6">
              <label class="form-label font-artistic fs-5 text-white mb-1">Universo asignado</label>
              
              <select id="adminUniverseSelect" class="form-select bg-black text-white border-secondary mb-2 font-artistic fs-5">
                <!-- Se llena dinámicamente desde admin.js -->
              </select>

              <div class="form-check form-switch mb-1">
                <input class="form-check-input" type="checkbox" id="checkNewUniverseAdmin">
                <label class="form-check-label small text-info font-artistic fs-6" for="checkNewUniverseAdmin">¿Registrar como Universo Nuevo?</label>
              </div>

              <input type="text" id="adminNewUniverseInput" class="form-control form-control-sm bg-black text-white border-secondary d-none font-artistic fs-6" placeholder="Nombre del nuevo universo...">
            </div>
          </div>

          <!-- BARRA DE HERRAMIENTAS ADICIONAL: LECTOR Y DICCIONARIO ANTI-RUIDO -->
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2 p-2 rounded bg-black border border-secondary">
            
            <!-- Controles Texto a Voz (TTS) -->
            <div class="d-flex align-items-center gap-1">
              <span class="text-white-50 small me-1 font-artistic fs-6"><i class="bi bi-megaphone"></i> Escuchar:</span>
              <button type="button" class="btn btn-sm btn-outline-success font-artistic" id="btnPlayTTS" title="Leer texto seleccionado o borrador completo">
                <i class="bi bi-play-fill"></i> Leer
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger font-artistic" id="btnStopTTS" title="Detener lectura">
                <i class="bi bi-stop-fill"></i> Detener
              </button>
            </div>

            <!-- Ignorador de Palabras Marcadas -->
            <div>
              <button type="button" class="btn btn-sm btn-outline-info font-artistic" id="btnIgnoreSelected">
                <i class="bi bi-eye-slash me-1"></i> Ignorar Selección
              </button>
            </div>

          </div>

          <!-- Editor de Texto Quill -->
          <div class="mb-2">
            <label class="form-label font-artistic fs-5 text-white mb-1">Contenido de la Historia / Capítulo</label>
            <div id="admin-editor-container" style="height: 320px;"></div>
          </div>
        </div>

        <div class="modal-footer border-secondary d-flex justify-content-between">
          <button type="button" class="btn btn-sm btn-outline-danger font-artistic d-none" id="btnDeleteStory">
            <i class="bi bi-trash me-1"></i> Eliminar Historia
          </button>
          
          <div class="ms-auto gap-2 d-flex">
            <button type="button" class="btn btn-sm btn-outline-light font-artistic" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-sm btn-light text-dark font-artistic fw-bold" id="btnSaveAdminStory">
              <i class="bi bi-cloud-arrow-up me-1"></i> Guardar Obra
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS: Bootstrap y Quill -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

  <!-- Script del Administrador -->
  <script type="module" src="admin.js"></script>
</body>
</html>
