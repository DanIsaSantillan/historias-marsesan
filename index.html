<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historias de MarseSan</title>
  
  <!-- Foto de Perfil como Icono -->
  <link rel="icon" href="Atributos/FondoPerfil/Perfil.png" type="image/jpeg">
  <link rel="apple-touch-icon" href="Atributos/FondoPerfil/Perfil.png">
  
  <!-- Archivo de Configuración de Web App -->
  <link rel="manifest" href="Atributos/json/manifest.json">
  <meta name="theme-color" content="#050508">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Google Fonts: Caveat para UI + Lora para lectura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="Atributos/css/style.css">
</head>
<body>

  <!-- Navegación Superior -->
  <nav class="navbar navbar-expand-lg border-bottom galaxy">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 text-white font-artistic" href="#">
        <img src="Atributos/FondoPerfil/Perfil.png"
             id="profileTrigger"
             alt="Perfil de Marse"
             class="perfil rounded-circle"
             style="width: 32px; height: 32px; object-fit: cover; cursor: pointer;">
        <span class="fw-bold cursiva nav-small text-white">Historias de MarseSan</span>
      </a>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main class="container-fluid p-0">
    <div class="row g-0">

      <!-- COLUMNA IZQUIERDA (SIDEBAR DE BÚSQUEDA Y UNIVERSOS) -->
      <aside class="col-12 col-md-3 col-lg-2 sidebar-galaxy border-end border-secondary-subtle p-3 p-md-4 sidebar-cursiva">
        <div class="sticky-top d-flex flex-column justify-content-between sidebar-content-container">
          
          <div>
            <!-- BUSCADOR EN TIEMPO REAL -->
            <h6 class="text-uppercase fw-bold text-white h6-small mb-2">
              <i class="bi bi-search me-1"></i> Buscar Historia
            </h6>
            <div class="input-group mb-3">
              <input type="text" id="searchInput" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Título o palabra clave...">
            </div>

            <!-- FILTROS POR UNIVERSO / CLASIFICACIÓN -->
            <h6 class="text-uppercase fw-bold text-white h6-small mb-2">
              <i class="bi bi-funnel me-1"></i> Universos
            </h6>
            
            <div class="d-flex flex-md-column gap-2 mb-3 filter-scroll-container" id="universeFilters">
              <!-- Los filtros de universos se insertan dinámicamente desde Firestore -->
              <button class="btn btn-sm btn-outline-light active btn-filter text-start text-nowrap" data-filter="all">
                <i class="bi bi-journal-album me-1"></i>Todos los Escritos
              </button>
            </div>
          </div>

        </div>
      </aside>

      <!-- COLUMNA DERECHA (GRID / CATÁLOGO DE HISTORIAS) -->
      <section class="col-12 col-md-9 col-lg-10 p-4 dark-galaxy">
        <div class="row g-4" id="storiesGrid">
          <!-- Las tarjetas de historias se cargarán aquí dinámicamente -->
        </div>
      </section>

    </div>
  </main>

  <!-- MODAL DE LECTURA DE HISTORIA COMPLETA -->
  <div class="modal fade" id="readerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content bg-dark border-secondary text-white">
        <div class="modal-header border-secondary">
          <div>
            <span id="readerUniverse" class="badge bg-secondary font-artistic me-2">Universo</span>
            <h4 id="readerTitle" class="modal-title font-artistic text-white d-inline">Título de la Historia</h4>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4 story-content text-white" id="readerContent">
          <!-- Contenido dinámico cargado desde JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Lógica de Interacción JS -->
  <script type="module" src="Atributos/js/main.js"></script>
</body>
</html>
